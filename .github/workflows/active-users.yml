# Refreshes data/active-users.json for the contact section's "Active users" card.
# Needs the repository secret GA_CREDENTIALS: the JSON key of a Google Cloud
# service account that has Viewer access on GA4 property 554579350.
name: Active users

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-users
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install google-analytics-data

      - name: Fetch from Google Analytics
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
        run: |
          printf '%s' "$GA_CREDENTIALS" > "$RUNNER_TEMP/ga.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga.json" python3 scripts/fetch_active_users.py

      - name: Commit if the numbers moved
        run: |
          # The timestamp alone changing isn't worth a commit and a Pages rebuild.
          if git diff -U0 data/active-users.json | grep -E '^[+-] *"(value|change)"' -q; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            git add data/active-users.json
            git commit -m 'Refresh active users'
            git push
          fi
