# Refreshes data/active-users.json for the contact section's "Active users" card.
# Signs in to Google Cloud keylessly (Workload Identity Federation) as a
# service account that has Viewer access on GA4 property 554579350.
# Needs two repository variables (not secrets):
#   GCP_WIF_PROVIDER     projects/<number>/locations/global/workloadIdentityPools/github/providers/poncedesign
#   GCP_SERVICE_ACCOUNT  ga-ticker@<project-id>.iam.gserviceaccount.com
name: Active users

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # lets the job prove to Google it's this repo

concurrency:
  group: active-users
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install google-analytics-data

      # Sets GOOGLE_APPLICATION_CREDENTIALS for the next step; no stored key.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Fetch from Google Analytics
        run: python3 scripts/fetch_active_users.py

      - name: Commit if the numbers moved
        run: |
          # The timestamp alone changing isn't worth a commit and a Pages rebuild.
          # Staged first so the very first run, when the file is new, counts too.
          git add data/active-users.json
          if git diff --cached -U0 data/active-users.json | grep -E '^[+-] *"(value|change)"' -q; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh active users'
            git push
          fi
