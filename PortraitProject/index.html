<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masters of Computing</title>
<style>
  :root {
    --cols: 3;
    --page-pad: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 2rem clamp(1rem, 4vw, 3rem) 36px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0.5rem 0 0;
    font-size: 0.875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8a8a;
  }

  /* Grid: rows of 3, 8px between the circles */
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: 8px;
    padding: 0 var(--page-pad);
    line-height: 0;
  }

  /* Square cell, circular mask: each image becomes one giant
     halftone dot, and with gap 0 the circles sit tangent. */
  .grid figure {
    margin: 0;
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 50%;
    background: #000;
  }

  .grid img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Hover swaps the portrait for its filename. */
  .grid figcaption {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 14%;
    background: #000;
    color: #f2efe9;
    font-size: clamp(0.7rem, 1.5vw, 0.95rem);
    letter-spacing: 0.12em;
    line-height: 1.35;
    text-align: center;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 180ms ease;
  }

  /* Pointer devices only, so the caption never sticks on touch. */
  @media (hover: hover) {
    .grid figure:hover figcaption,
    .grid figure:focus-within figcaption {
      opacity: 1;
    }
  }

  /* Tablet: 2 across */
  @media (max-width: 900px) {
    :root { --cols: 2; }
  }

  /* Phone: single column */
  @media (max-width: 560px) {
    :root { --cols: 1; }
  }

  footer {
    padding: 2rem clamp(1rem, 4vw, 3rem) 3rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }
</style>
</head>
<body>

<header>
  <h1>Masters of Computing</h1>
  <p>Portrait Project</p>
</header>

<main class="grid">
  <figure><img src="images/babbage.jpg" alt="Babbage" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Babbage</figcaption></figure>
  <figure><img src="images/berners-lee.jpg" alt="Berners-Lee" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Berners-Lee</figcaption></figure>
  <figure><img src="images/hamilton.jpg" alt="Hamilton" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Hamilton</figcaption></figure>
  <figure><img src="images/hopper.jpg" alt="Hopper" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Hopper</figcaption></figure>
  <figure><img src="images/lovelace.jpg" alt="Lovelace" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Lovelace</figcaption></figure>
  <figure><img src="images/neumann.jpg" alt="Neumann" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Neumann</figcaption></figure>
  <figure><img src="images/perlman.jpg" alt="Perlman" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Perlman</figcaption></figure>
  <figure><img src="images/ritchie.jpg" alt="Ritchie" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Ritchie</figcaption></figure>
  <figure><img src="images/shannon.jpg" alt="Shannon" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Shannon</figcaption></figure>
  <figure><img src="images/torvalds.jpg" alt="Torvalds" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Torvalds</figcaption></figure>
  <figure><img src="images/turing.jpg" alt="Turing" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Turing</figcaption></figure>
  <figure><img src="images/wozniak.jpg" alt="Wozniak" width="825" height="1100" loading="lazy" decoding="async"><figcaption>Wozniak</figcaption></figure>
</main>

<footer>PonceDesign Labs 2026</footer>

</body>
</html>
