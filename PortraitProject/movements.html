<title>Overcast</title>
<style>
  :root {
    --page-pad: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 2rem clamp(1rem, 4vw, 3rem) 36px;
  }

  /* Labs nav, styled as tabs: one page per tab. */
  .tabs {
    display: flex;
    gap: 1.5rem;
    padding: 1.25rem clamp(1rem, 4vw, 3rem) 0;
  }

  .tabs a {
    padding: 0.5rem 0;
    border-bottom: 1px solid transparent;
    color: #8a8a8a;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
  }

  .tabs a:hover { color: #f2efe9; }

  .tabs a[aria-current="page"] {
    color: #f2efe9;
    border-bottom-color: #f2efe9;
  }

  .tabs a:focus-visible {
    outline: 2px solid #f2efe9;
    outline-offset: 4px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0.5rem 0 0;
    font-size: 0.875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8a8a;
  }

  /* Movements: the footage is never shown, only drawn as dots. */
  .stage {
    position: relative;
    margin: 0 var(--page-pad);
    height: min(56.25vw, 78vh);
    min-height: 320px;
    background: #000;
    touch-action: pan-y;
  }

  .stage canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Kept rendered (not display:none) so every browser keeps decoding frames. */
  .stage video {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .stage-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem var(--page-pad) 0;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }

  .stage-bar button {
    padding: 0.4rem 0.9rem;
    border: 1px solid #3a3a3a;
    border-radius: 999px;
    background: none;
    color: #f2efe9;
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
  }

  .stage-bar button:hover { border-color: #8a8a8a; }

  .stage-bar button:focus-visible {
    outline: 2px solid #f2efe9;
    outline-offset: 2px;
  }

  footer {
    padding: 2rem clamp(1rem, 4vw, 3rem) 3rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }
</style>
</head>
<body>

<nav class="tabs" aria-label="PonceDesign Labs">
  <a href="../">PonceDesign</a>
  <a href="./">Portraits</a>
  <a href="movements.html" aria-current="page">Movements</a>
</nav>

<main>
<section id="movements">
<header>
  <h1>Overcast</h1>
  <p>Movements</p>
</header>

<div class="stage" data-src="../assets/video/mvi-1293.mp4" data-poster="../assets/video/mvi-1293.jpg">
  <canvas role="img" aria-label="Grey clouds drifting across the sky, drawn as a field of white dots that swell with the light"></canvas>
</div>
<div class="stage-bar">
  <button type="button" class="stage-sound" aria-pressed="false">Sound off</button>
  <button type="button" class="stage-toggle" aria-pressed="false">Pause</button>
</div>
</section>
</main>

<footer>PonceDesign Labs 2026</footer>

<script>
/* Movements: the cloud footage, resampled every frame onto a coarse grid
   and redrawn as dots sized by brightness. The clip is flat grey, so the
   grid is stretched between its own 2nd and 98th percentile (eased, so the
   exposure breathes instead of flickering). Drawing stops while the
   stage is off screen or the browser tab is in the background. */
(function () {
  "use strict";

  var stage = document.querySelector(".stage");
  var cvs = stage.querySelector("canvas");
  var ctx = cvs.getContext("2d");
  var toggle = document.querySelector(".stage-toggle");
  var soundBtn = document.querySelector(".stage-sound");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var SPEED = 1.728;          // same pace as the footage on the home page
  var INK = "#f2efe9";
  var CUT = 3.2;              // half-width of the cut, in cells
  var HEAL = 0.9;             // seconds for a displaced dot to close ~63% of the way home
  var sample = document.createElement("canvas");
  var sctx = sample.getContext("2d", { willReadFrequently: true });

  var video = null, poster = null;
  var paused = reduced, onScreen = true, raf = 0;
  var w = 0, h = 0, dpr = 1, cell = 10, cols = 0, rows = 0;
  var lo = 0.3, hi = 0.8, primed = false;
  var hist = new Uint32Array(64);
  /* Each dot's displacement from its grid position. Cuts write to it; it
     eases back to zero every frame, which is the repair. */
  var offX = new Float32Array(0), offY = new Float32Array(0);
  var healing = false, last = 0;
  var pointer = { x: 0, y: 0, t: 0, inside: false };
  var cuts = [];

  function start() {
    if (video) return;
    poster = new Image();
    poster.onload = kick;
    poster.src = stage.getAttribute("data-poster");

    video = document.createElement("video");
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    video.setAttribute("aria-hidden", "true");
    video.disablePictureInPicture = true;
    video.preload = "auto";
    video.src = stage.getAttribute("data-src");
    video.defaultPlaybackRate = video.playbackRate = SPEED;
    video.addEventListener("loadeddata", kick);
    stage.appendChild(video);

    measure();
    if ("ResizeObserver" in window) new ResizeObserver(function () { measure(); kick(); }).observe(stage);
    else addEventListener("resize", function () { measure(); kick(); });
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        onScreen = entries[0].isIntersecting;
        sync();
      }).observe(stage);
    }
    document.addEventListener("visibilitychange", sync);
    toggle.textContent = paused ? "Play" : "Pause";
    toggle.setAttribute("aria-pressed", paused ? "true" : "false");
  }

  function measure() {
    w = stage.clientWidth;
    h = stage.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(w * dpr);
    cvs.height = Math.round(h * dpr);
    cell = Math.max(7, Math.min(14, w / 110));
    cols = Math.ceil(w / cell) + 1;
    rows = Math.ceil(h / cell) + 1;
    sample.width = cols;
    sample.height = rows;
    offX = new Float32Array(cols * rows);
    offY = new Float32Array(cols * rows);
    healing = false;
  }

  function active() { return onScreen && !document.hidden; }

  /* Wind: looped brown noise through a band-pass whose level and pitch
     follow pointer speed. It is all synthesised, so there is no file to
     load. Browsers only allow audio after a click, tap or key press on the
     page, so the first one anywhere starts it (or the Sound button does).
     Moving swells the wind quickly; once the pointer stops it dies away
     over several seconds. */
  var audio = null, soundWanted = true;
  var RISE = 0.12;            // seconds (time constant) to swell toward the gust
  var FADE = 2.6;             // time constant of the fade once movement stops

  function buildAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    var ac = new AC();
    var len = ac.sampleRate * 4, buf = ac.createBuffer(1, len, ac.sampleRate);
    var ch = buf.getChannelData(0), last = 0;
    for (var i = 0; i < len; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      ch[i] = last * 3.5;
    }
    var src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    var body = ac.createBiquadFilter();    // the broad rush
    body.type = "bandpass";
    body.frequency.value = 350;
    body.Q.value = 0.7;

    var whistle = ac.createBiquadFilter(); // a thin, higher howl on top
    whistle.type = "bandpass";
    whistle.frequency.value = 900;
    whistle.Q.value = 9;
    var whistleGain = ac.createGain();
    whistleGain.gain.value = 0.35;

    var gain = ac.createGain();
    gain.gain.value = 0;

    src.connect(body);
    src.connect(whistle);
    whistle.connect(whistleGain);
    body.connect(gain);
    whistleGain.connect(gain);
    gain.connect(ac.destination);
    src.start();
    return { ac: ac, gain: gain.gain, body: body.frequency, whistle: whistle.frequency };
  }

  function soundOn() { return !!(audio && soundWanted && audio.ac.state === "running"); }

  function showSound() {
    var on = soundOn();
    soundBtn.textContent = on ? "Sound on" : "Sound off";
    soundBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }

  function unlock(e) {
    /* The Sound button decides for itself; unlocking on its pointerdown
       would turn the sound on just before its click turns it back off. */
    if (e && e.target.closest && e.target.closest(".stage-sound")) return;
    if (!soundWanted) return;
    if (!audio) audio = buildAudio();
    if (!audio) return;
    if (audio.ac.state !== "running" && active()) {
      audio.ac.resume().then(showSound, showSound);
    }
    showSound();
  }

  function syncAudio() {
    if (!audio) return;
    if (soundWanted && active()) audio.ac.resume().then(showSound, showSound);
    else audio.ac.suspend().then(showSound, showSound);
  }

  /* speed in px/s: swell toward it now, then let it go slowly. */
  function gust(speed) {
    if (!soundOn()) return;
    var t = audio.ac.currentTime, s = Math.min(1, speed / 1800);
    [
      [audio.gain, 0.05 + 0.55 * Math.pow(s, 0.8), 0],
      [audio.body, 320 + 900 * s, 320],
      [audio.whistle, 700 + 1100 * s, 700]
    ].forEach(function (p) {
      var param = p[0];
      param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
      param.setTargetAtTime(p[1], t, RISE);
      param.setTargetAtTime(p[2], t + RISE * 1.5, FADE);
    });
  }

  function sync() {
    syncAudio();
    if (!video) return;
    if (active() && !paused) {
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      video.pause();
    }
    kick();
  }

  function kick() {
    if (!raf && active()) raf = requestAnimationFrame(frame);
  }

  /* Cover-crop the source into the sample grid. */
  function grab() {
    var src = null, sw = 0, sh = 0;
    if (video && video.readyState >= 2 && video.videoWidth) {
      src = video; sw = video.videoWidth; sh = video.videoHeight;
    } else if (poster && poster.complete && poster.naturalWidth) {
      src = poster; sw = poster.naturalWidth; sh = poster.naturalHeight;
    }
    if (!src || !cols || !rows) return null;
    var scale = Math.max(cols / sw, rows / sh);
    var cw = cols / scale, ch = rows / scale;
    sctx.imageSmoothingQuality = "high";
    sctx.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, cols, rows);
    return sctx.getImageData(0, 0, cols, rows).data;
  }

  /* Push every dot within CUT cells of the pointer's path out to the edge
     of that band, so the stroke leaves a clean channel with round ends. */
  function cut(x0, y0, x1, y1) {
    var band = CUT * cell, reach = band * 2;
    var sx = x1 - x0, sy = y1 - y0, len2 = sx * sx + sy * sy;
    var nx = len2 ? -sy / Math.sqrt(len2) : 0, ny = len2 ? sx / Math.sqrt(len2) : 1;
    var gx0 = Math.max(0, Math.floor((Math.min(x0, x1) - reach) / cell));
    var gx1 = Math.min(cols - 1, Math.ceil((Math.max(x0, x1) + reach) / cell));
    var gy0 = Math.max(0, Math.floor((Math.min(y0, y1) - reach) / cell));
    var gy1 = Math.min(rows - 1, Math.ceil((Math.max(y0, y1) + reach) / cell));
    for (var gy = gy0; gy <= gy1; gy++) {
      for (var gx = gx0; gx <= gx1; gx++) {
        var i = gy * cols + gx;
        var px = gx * cell + offX[i], py = gy * cell + offY[i];
        var u = len2 ? ((px - x0) * sx + (py - y0) * sy) / len2 : 0;
        u = u < 0 ? 0 : u > 1 ? 1 : u;
        var dx = px - (x0 + sx * u), dy = py - (y0 + sy * u);
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d >= band) continue;
        if (d < 0.001) {
          /* Dead on the path: send it to whichever side its home is on. */
          var side = (gx * cell - x0) * nx + (gy * cell - y0) * ny < 0 ? -1 : 1;
          dx = nx * side; dy = ny * side; d = 1;
        }
        offX[i] += dx / d * (band - d);
        offY[i] += dy / d * (band - d);
        healing = true;
      }
    }
  }

  function frame(now) {
    raf = 0;
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;
    var data = grab();
    var n = cols * rows, i, l;
    var luma = new Float32Array(n);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);

    if (data) {
      hist.fill(0);
      for (i = 0; i < n; i++) {
        l = (data[i * 4] * 0.2126 + data[i * 4 + 1] * 0.7152 + data[i * 4 + 2] * 0.0722) / 255;
        luma[i] = l;
        hist[Math.min(63, (l * 64) | 0)]++;
      }
      var a = 0, b = 63, acc = 0;
      for (acc = 0, a = 0; a < 63 && acc + hist[a] < n * 0.02; a++) acc += hist[a];
      for (acc = 0, b = 63; b > 0 && acc + hist[b] < n * 0.02; b--) acc += hist[b];
      var tlo = a / 64, thi = Math.max((b + 1) / 64, tlo + 0.08);
      var ease = primed ? 0.04 : 1;
      lo += (tlo - lo) * ease;
      hi += (thi - hi) * ease;
      primed = true;

      while (cuts.length) cut.apply(null, cuts.shift());

      /* Repair: every displaced dot drifts home, slowing as it arrives. */
      if (healing) {
        var k = 1 - Math.exp(-dt / HEAL), most = 0;
        for (i = 0; i < n; i++) {
          if (offX[i] === 0 && offY[i] === 0) continue;
          offX[i] -= offX[i] * k;
          offY[i] -= offY[i] * k;
          var m = Math.abs(offX[i]) + Math.abs(offY[i]);
          if (m < 0.05) { offX[i] = 0; offY[i] = 0; }
          else if (m > most) most = m;
        }
        healing = most > 0;
      }

      var maxR = cell * 0.62, span = hi - lo;
      ctx.beginPath();
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var t = (luma[y * cols + x] - lo) / span;
          if (t <= 0) continue;
          if (t > 1) t = 1;
          var r = Math.pow(t, 1.4) * maxR;
          if (r * dpr < 0.35) continue;
          var j = y * cols + x;
          var px = x * cell + offX[j], py = y * cell + offY[j];
          ctx.moveTo(px + r, py);
          ctx.arc(px, py, r, 0, 6.2832);
        }
      }
      ctx.fillStyle = INK;
      ctx.fill();
    }

    if (active() && (!paused || healing || cuts.length || !data)) raf = requestAnimationFrame(frame);
    else last = 0;
  }

  /* Only movement cuts: each pointer move adds the segment it travelled. */
  function point(e) {
    var box = cvs.getBoundingClientRect();
    var x = e.clientX - box.left, y = e.clientY - box.top;
    if (pointer.inside) {
      cuts.push([pointer.x, pointer.y, x, y]);
      var dt = (e.timeStamp - pointer.t) / 1000;
      if (dt > 0) gust(Math.sqrt((x - pointer.x) * (x - pointer.x) + (y - pointer.y) * (y - pointer.y)) / Math.max(dt, 0.008));
    }
    pointer.x = x;
    pointer.y = y;
    pointer.t = e.timeStamp;
    pointer.inside = true;
    kick();
  }
  function lift() { pointer.inside = false; }
  cvs.addEventListener("pointermove", point);
  cvs.addEventListener("pointerdown", function (e) { lift(); point(e); });
  cvs.addEventListener("pointerleave", lift);
  cvs.addEventListener("pointercancel", lift);

  toggle.addEventListener("click", function () {
    paused = !paused;
    toggle.textContent = paused ? "Play" : "Pause";
    toggle.setAttribute("aria-pressed", paused ? "true" : "false");
    sync();
  });

  soundBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    soundWanted = !soundOn();
    if (soundWanted) unlock();
    else syncAudio();
    showSound();
  });
  ["pointerdown", "keydown"].forEach(function (type) {
    document.addEventListener(type, unlock);
  });

  start();
  sync();
})();
</script>

</body>
</html>
