/* Struggling for pleasure: a field of hand-drawn cacti, each stretching up
   from its base by its own 25–40%. When Wim Mertens' official upload is
   played in the YouTube player, its own controls being the page's, the
   cacti rise with it: a random
   handful on each beat, in a random order, and a wave across the field on
   each strong beat, then they sink back. Silent, they breathe at random.
   Under the pointer a cactus fills white and the ones around it bend away
   and sway back, like grass parting, and new cacti multiply around the
   pointer, sinking back as it moves away. With reduced motion they stay still
   until the music plays, and do not bend.

   As the music runs, new cacti sprout on the beat at random spots, and
   the field fills with them where the music is fast and thins out where
   it slows: the busyness follows how close together the beats fall in
   the beat map. As the tempo speeds up they multiply faster: more per
   beat, budding off the cacti already there, and growing in quicker.
   Without a map it builds over the length of the piece.

    [322.603,1], [322.85,1], [323.037,1], [323.27,1], [323.47,1], [323.67,1], [323.918,1], [324.12,1],
    [324.337,1], [324.537,1], [324.821,2], [325.07,2], [325.305,2], [325.57,2], [325.804,2], [326.052,2],
    [326.255,2], [326.52,2], [326.738,2], [326.97,2], [327.22,2], [327.47,2], [327.721,2], [327.97,2],
    [328.184,2], [328.42,2], [328.638,2], [328.903,2], [329.137,2], [329.387,2], [329.637,2], [331.104,2],
    [331.321,2], [331.603,2], [331.803,2], [332.036,2], [332.236,2], [332.471,2], [332.703,2], [333.07,2],
    [333.32,2], [333.553,2], [333.786,2], [334.02,2], [334.253,2], [334.471,2], [334.72,2], [334.97,2],
    [335.204,2], [335.436,2], [335.671,2], [335.904,2], [336.104,2], [336.353,2], [336.587,2], [336.822,2],
    [337.07,2], [337.303,2], [337.52,2], [337.804,2], [338.036,2], [338.287,2], [338.504,2], [338.754,2],
    [339.004,2], [339.236,2], [339.504,2], [339.737,2], [339.97,2], [340.22,2], [340.454,2], [340.686,2],
    [340.984,2], [341.153,2], [341.404,2], [341.636,2], [341.886,2], [342.136,2], [342.353,2], [342.603,2],
    [342.854,2], [343.119,2], [343.353,2], [343.603,2], [343.854,2], [344.12,2], [344.387,2], [344.621,2],
    [344.871,2], [345.153,2], [345.388,2], [345.654,2], [345.936,2], [346.187,2], [346.454,2], [346.704,2],
    [346.937,2], [347.186,2], [347.436,2], [347.704,2], [347.969,2], [348.221,2], [348.451,2], [348.704,2],
    [348.97,2], [349.236,2], [349.527,2], [349.77,2], [350.037,2], [350.304,2], [350.583,2], [350.854,2],
    [351.12,2], [351.354,2], [351.651,2], [351.837,2]
  ];
  var params = new URLSearchParams(location.search);
  var BPM = parseFloat(params.get("bpm")) || 76;
  var OFFSET = parseFloat(params.get("offset")) || 0;
  var MAP_KEY = "sfp-beat-map";

  var stage = document.querySelector(".stage");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var embed = document.documentElement.classList.contains("embed");
  var tapping = !embed && params.has("tap");

  if (tapping) {
    try { BEATS = JSON.parse(localStorage.getItem(MAP_KEY)) || BEATS; } catch (e) {}
  }

  var svg = null, cacti = [], originals = 0, sprouts = null;
  var MAX_SPROUTS = 300, busy = 0, rush = 0, rateLo = 1, rateHi = 3;
  var player = null, playing = false;
  var onPlayState = function () {};
  var clock = { t: 0, at: 0, reported: null };
  var lastBeat = -1, lastT = 0, lastWave = 0, nextIdle = 0, onScreen = true, raf = 0, last = 0;
  var pointer = null;   // {x, y} in the drawing's units while over the stage

  fetch("../assets/img/struggling-for-pleasure.svg")
    .then(function (r) { return r.text(); })
    .then(function (text) {
      stage.innerHTML = text;
      svg = stage.querySelector("svg");
      cacti = Array.prototype.map.call(svg.querySelectorAll(".cactus"), function (el) {
        var at = el.parentNode.getAttribute("transform").match(/[-\d.]+/g).map(Number);
        var box = el.getBBox();
        /* The drawing stores 10–20%; this page stretches them to 25–40%. */
        var s = parseFloat(el.getAttribute("data-s")) || 1.15;
        return { el: el, x: at[0], y: at[1], x0: box.x, x1: box.x + box.width, h: -box.y,
                 s: 1.25 + (s - 1.1) * 1.5, size: 1, flip: 1, g: 1, born: 0, dying: false,
                 v: 0, rising: false, kickAt: 0, att: 6, rel: 0.6,
                 bend: 0, bendV: 0, lit: false, shown: "" };
      });
      originals = cacti.length;
      sprouts = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.querySelector("g[clip-path]").appendChild(sprouts);
      mapChanged();
      run();
    });

  /* The beats per second around each beat of the map, and the slow and
     fast ends of that range, so busyness runs from 0 to 1 within the piece. */
  function rateAt(t) {
    var n = 0;
    for (var i = 0; i < BEATS.length; i++) {
      if (BEATS[i][0] > t - 3 && BEATS[i][0] <= t + 1) n++;
    }
    return n / 4;
  }

  function mapChanged() {
    if (BEATS.length < 8) return;
    var rates = BEATS.map(function (b) { return rateAt(b[0]); }).sort(function (a, b) { return a - b; });
    rateLo = rates[Math.floor(rates.length * 0.1)];
    rateHi = Math.max(rateLo + 0.25, rates[Math.floor(rates.length * 0.9)]);
  }

  /* How fast the tempo is rising, 0 to 1: the beat rate now against four
     seconds ago, over the piece's range. */
  function rushAt(t) {
    if (BEATS.length < 8) return 0;
    return Math.max(0, Math.min(1, (rateAt(t) - rateAt(t - 4)) / (rateHi - rateLo)));
  }

  function busyAt(t) {
    if (BEATS.length >= 8) {
      /* A sparse few even at the slowest. */
      return 0.12 + 0.88 * Math.max(0, Math.min(1, (rateAt(t) - rateLo) / (rateHi - rateLo)));
    }
    var length = (player && player.getDuration && player.getDuration()) || 240;
    var p = Math.max(0, Math.min(1, t / length));
    return 0.15 + 0.7 * p + 0.15 * Math.sin(p * Math.PI * 6);
  }

  /* A new cactus: a copy of one in the drawing, at a random size and
     facing, drawn among the other new ones by depth. It buds beside the
     cactus "near" when given, else at a random spot, and grows up out of
     the ground after delay. */
  function sprout(now, delay, near, atX, atY) {
    var src = cacti[Math.floor(Math.random() * originals)];
    var host = src.el.parentNode.cloneNode(true);
    var el = host.querySelector(".cactus");
    var size = 0.55 + Math.random() * 0.6, flip = Math.random() < 0.5 ? -1 : 1;
    var x = Math.random() * 3024, y = 120 + Math.random() * 1640;
    if (near) {
      x = Math.max(0, Math.min(3024, near.x + (Math.random() - 0.5) * 260));
      y = Math.max(120, Math.min(1760, near.y + (Math.random() - 0.3) * 140));
    }
    if (atX !== undefined) {
      x = Math.max(0, Math.min(3024, atX));
      y = Math.max(40, Math.min(1760, atY));
      size *= 0.75;
    }
    el.classList.remove("lit");
    el.setAttribute("transform", "scale(0 0)");
    host.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")");
    host.setAttribute("data-y", y);
    var before = null;
    for (var n = sprouts.firstChild; n; n = n.nextSibling) {
      if (+n.getAttribute("data-y") > y) { before = n; break; }
    }
    sprouts.insertBefore(host, before);
    var c = { el: el, host: host, x: x, y: y,
                 x0: flip > 0 ? src.x0 * size : -src.x1 * size,
                 x1: flip > 0 ? src.x1 * size : -src.x0 * size,
                 h: src.h * size, s: src.s, size: size, flip: flip,
                 g: 0, born: now + delay, dying: false, grow: 4 + 10 * busy + 12 * rush,
                 v: 0, rising: false, kickAt: 0, att: 6, rel: 0.6,
                 bend: 0, bendV: 0, lit: false, shown: "" };
    cacti.push(c);
    return c;
  }

  /* The music's new cacti still standing (not the pointer's). */
  function living() {
    var list = [];
    for (var i = originals; i < cacti.length; i++) {
      if (!cacti[i].dying && !cacti[i].byPointer) list.push(cacti[i]);
    }
    return list;
  }

  /* Around the pointer: keep about 28 new cacti within REACH of it, budding
     one every 30ms or so, quick to grow. Those it leaves behind past 1.3
     REACH sink back, and all of them when it leaves the drawing. */
  var REACH = 230, budAt = 0;
  function multiply(now) {
    var close = 0;
    for (var i = originals; i < cacti.length; i++) {
      var c = cacti[i];
      if (!c.byPointer || c.dying) continue;
      var d = pointer ? Math.hypot(c.x - pointer.x, c.y - 60 - pointer.y) : Infinity;
      if (d > REACH * 1.3) c.dying = true;
      else close++;
    }
    if (!pointer || reduced || close >= 28 || now < budAt) return;
    budAt = now + 30;
    var a = Math.random() * Math.PI * 2, r = REACH * Math.sqrt(Math.random());
    var c = sprout(now, 0, null, pointer.x + Math.cos(a) * r, pointer.y + 60 + Math.sin(a) * r * 0.6);
    c.byPointer = true;
    c.grow = 16;
    c.fade = 4;
  }

  function kick(c, now, delay, att, rel) {
    if (c.rising || c.kickAt) return;
    c.kickAt = now + delay;
    c.att = att;
    c.rel = rel;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), x = a[i];
      a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  function onBeat(strength, gap, now) {
    var gapMs = Math.max(250, Math.min(1500, gap * 1000));

    /* Sprout toward the busyness, a few per beat, more on a strong one and
       many more while the tempo is rising, mostly budding off cacti already
       there; past it, the oldest new cacti sink back into the ground. */
    var alive = living();
    var want = Math.round(MAX_SPROUTS * Math.min(1, Math.pow(busy, 1.4) * (1 + rush)));
    if (alive.length < want) {
      var add = Math.min(want - alive.length,
                         Math.ceil((1 + busy * 7) * (strength > 1 ? 2 : 1) * (1 + rush * 4)));
      for (var a = 0; a < add; a++) {
        var parent = Math.random() < 0.4 + 0.5 * rush
          ? (alive.length && Math.random() < 0.7 ? alive[Math.floor(Math.random() * alive.length)]
                                                 : cacti[Math.floor(Math.random() * originals)])
          : null;
        sprout(now, Math.random() * gapMs * (0.5 - 0.3 * rush), parent);
      }
    } else if (alive.length > want) {
      alive.slice(0, Math.ceil((alive.length - want) / 3)).forEach(function (c) { c.dying = true; });
    }

    var picks = shuffle(cacti.slice()).slice(0, Math.round(cacti.length * (strength > 1 ? 0.3 : 0.14)));
    picks.forEach(function (c, i) {
      /* Shuffled order, spread over the first third of the beat. */
      kick(c, now, (i / picks.length) * gapMs * 0.33,
           1000 / (gapMs * 0.06), 1000 / (gapMs * (0.8 + Math.random())));
    });
    if (strength > 1 && now - lastWave > 1200) {
      /* A strong beat also sends a wave across the field from a random side,
         at most one wave every 1.2s. */
      lastWave = now;
      var left = Math.random() < 0.5;
      cacti.forEach(function (c) {
        if (Math.random() < 0.55) return;
        var across = left ? c.x / 3024 : 1 - c.x / 3024;
        kick(c, now, across * gapMs * 0.9, 1000 / (gapMs * 0.1), 1000 / (gapMs * 1.6));
      });
    }
  }

  /* Beats between the last frame's time and this one's, from the map or
     from the tempo. A jump (a seek, or a stall) skips straight past. */
  function beatsBetween(t0, t1, now) {
    if (t1 < t0 || t1 - t0 > 1) return;
    if (BEATS.length) {
      for (var i = 0; i < BEATS.length; i++) {
        var b = BEATS[i];
        if (b[0] > t0 && b[0] <= t1) {
          var next = BEATS[i + 1];
          onBeat(b[1] || 1, next ? next[0] - b[0] : 60 / BPM, now);
        }
      }
      return;
    }
    var beat = Math.floor((t1 - OFFSET) * BPM / 60);
    if (beat !== lastBeat && beat >= 0) onBeat(beat % 4 === 0 ? 2 : 1, 60 / BPM, now);
    lastBeat = beat;
  }

  function playerTime(now) {
    return clock.t + (now - clock.at) / 1000;
  }

  function frame(now) {
    raf = 0;
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    var t = 0;

    if (playing && player && player.getCurrentTime) {
      var reported = player.getCurrentTime();
      if (reported !== clock.reported) {
        clock.reported = reported;
        clock.t = reported;
        clock.at = now;
      }
      t = playerTime(now);
      busy = busyAt(t);
      rush = rushAt(t);
      beatsBetween(lastT, t, now);
      lastT = t;
    } else if (!reduced && now >= nextIdle) {
      /* Silent: one cactus at a time, slowly. */
      var c = cacti[Math.floor(Math.random() * cacti.length)];
      if (c) kick(c, now, 0, 0.8 + Math.random() * 0.6, 0.25 + Math.random() * 0.2);
      /* And the new cacti sink back, one at a time. */
      var alive = living();
      if (alive.length) alive[Math.floor(Math.random() * alive.length)].dying = true;
      nextIdle = now + 60 + Math.random() * 120;
    }

    /* Under the beats, the whole field swells and settles over eight beats. */
    var swell = playing ? 0.18 * (0.5 - 0.5 * Math.cos(t * BPM / 60 * Math.PI / 4)) : 0;
    var front = -1;   // the cactus under the pointer that is drawn on top
    multiply(now);

    for (var i = cacti.length - 1; i >= originals; i--) {
      var n = cacti[i];
      if (n.dying) n.g -= Math.min(n.g, (n.fade || 2.5) * dt);
      else if (now >= n.born) n.g += (1 - n.g) * Math.min(1, n.grow * dt);
      if (n.dying && n.g <= 0) {
        n.host.remove();
        cacti.splice(i, 1);
      }
    }

    for (var i = 0; i < cacti.length; i++) {
      var k = cacti[i];
      if (k.kickAt && now >= k.kickAt) { k.kickAt = 0; k.rising = true; }
      if (k.rising) {
        k.v += (1 - k.v) * Math.min(1, k.att * dt);
        if (k.v > 0.97) k.rising = false;
      } else {
        k.v -= k.v * Math.min(1, k.rel * dt);
      }
      var sy = 1 + (k.s - 1) * Math.max(k.v, swell);

      /* Grass: bend away from the pointer, on a spring so it sways back. */
      var target = 0, over = false;
      if (pointer) {
        var top = k.y - k.h * sy * k.g, dx = pointer.x - k.x;
        over = pointer.x >= k.x + k.x0 && pointer.x <= k.x + k.x1 && pointer.y >= top && pointer.y <= k.y;
        var reach = 220, near = 1 - Math.abs(dx) / reach;
        var tall = pointer.y >= top - 80 && pointer.y <= k.y + 40;
        if (!reduced && near > 0 && tall) target = (dx > 0 ? 1 : -1) * 32 * near * near;
      }
      /* Snap away from the pointer; sway back on the spring. */
      if (Math.abs(target) > Math.abs(k.bend) && target * k.bend >= 0) {
        k.bend = target;
        k.bendV = 0;
      } else {
        k.bendV += (180 * (target - k.bend) - 14 * k.bendV) * dt;
        k.bend += k.bendV * dt;
      }
      if (over) front = i;

      var sx = k.size * k.flip * (0.5 + 0.5 * k.g);
      var shown = (Math.abs(k.bend) > 0.05 ? "skewX(" + k.bend.toFixed(2) + ") " : "") +
                  "scale(" + sx.toFixed(3) + " " + (sy * k.size * k.g).toFixed(4) + ")";
      if (shown !== k.shown) {
        k.shown = shown;
        k.el.setAttribute("transform", shown);
      }
    }
    for (var j = 0; j < cacti.length; j++) {
      if ((j === front) !== cacti[j].lit) {
        cacti[j].lit = j === front;
        cacti[j].el.classList.toggle("lit", cacti[j].lit);
      }
    }
    run();
  }

  function active() {
    return onScreen && !document.hidden && (playing || pointer || !reduced || cacti.length > originals);
  }

  function run() {
    if (raf || !cacti.length) return;
    if (!active()) { last = 0; return; }
    raf = requestAnimationFrame(frame);
  }

  function track(e) {
    if (!svg) return;
    var m = svg.getScreenCTM();
    if (!m) return;
    var p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    pointer = { x: p.x, y: p.y };
    run();
  }

  stage.addEventListener("pointermove", track);
  stage.addEventListener("pointerdown", track);
  stage.addEventListener("pointerleave", function () { pointer = null; });
  stage.addEventListener("pointercancel", function () { pointer = null; });

  function buildPlayer() {
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt", {
        host: "https://www.youtube-nocookie.com",
        videoId: VIDEO_ID,
        /* No control bar: a click on the video plays and pauses it. */
        playerVars: { playsinline: 1, rel: 0, controls: 0 },
        events: {
          onStateChange: function (e) {
            playing = e.data === YT.PlayerState.PLAYING;
            if (playing) {
              clock.reported = null;
              lastBeat = -1;
              lastT = player.getCurrentTime();
            }
            onPlayState();
            run();
          }
        }
      });
    };
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }

  if (!embed) buildPlayer();

  if (tapping) {
    var taps = BEATS.slice(), box = document.createElement("div");
    box.className = "tap";
    box.innerHTML = '<span></span> <button type="button" data-act="copy">Copy beat map</button>' +
                    ' <button type="button" data-act="clear">Clear</button>';
    var label = box.querySelector("span");
    function showTaps() {
      label.textContent = taps.length ? taps.length + " beats, last at " + taps[taps.length - 1][0].toFixed(2) + "s"
                                      : (playing ? "Click the drawing or press T on each beat, Shift for a strong one"
                                                : "Play the video, then click the drawing on each beat");
    }
    function save() {
      taps.sort(function (a, b) { return a[0] - b[0]; });
      BEATS = taps.slice();
      mapChanged();
      try { localStorage.setItem(MAP_KEY, JSON.stringify(taps)); } catch (e) {}
      showTaps();
    }
    document.body.appendChild(box);
    showTaps();
    onPlayState = showTaps;
    function tap(strong) {
      if (!playing) { showTaps(); return; }
      var at = Math.round(playerTime(performance.now()) * 1000) / 1000;
      /* A new pass over beats already tapped replaces them from here on. */
      taps = taps.filter(function (b) { return b[0] < at - 0.15; });
      taps.push([at, strong ? 2 : 1]);
      save();
    }
    document.addEventListener("keydown", function (e) {
      if ((e.key === "t" || e.key === "T") && !e.repeat) tap(e.shiftKey);
    });
    stage.addEventListener("pointerdown", function (e) { tap(e.shiftKey); });
    box.addEventListener("click", function (e) {
      var act = e.target.getAttribute("data-act");
      if (act === "clear") { taps = []; save(); }
      if (act === "copy" && navigator.clipboard) {
        navigator.clipboard.writeText(JSON.stringify(taps)).then(function () { label.textContent = "Copied " + taps.length + " beats"; });
      }
    });
  }

  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      run();
    }).observe(stage);
  }
  document.addEventListener("visibilitychange", run);
})();
