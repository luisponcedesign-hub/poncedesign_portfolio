<section id="holocene">

</header>

<div class="frame">
  <div class="stage">
    <video src="../assets/video/holocene.mp4" poster="../assets/video/holocene.jpg"
           muted loop playsinline preload="auto" disablepictureinpicture
           aria-label="Holocene: a sped-up, looping montage of handheld footage."></video>
  </div>
  <div class="stage-bar">
    <button type="button" class="stage-sound">Sound on</button>
  </div>
</div>
</section>
</main>

<footer>PDL 2026</footer>

<script>
/* Holocene: a sped-up clip that loops, muted until Sound on is pressed.
   It plays only while on screen and visible; with reduced motion it
   waits on the still frame until Sound on starts it. */
(function () {
  "use strict";

  var video = document.querySelector(".stage video");
  var soundBtn = document.querySelector(".stage-sound");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var wanted = !reduced, onScreen = true;

  function sync() {
    if (wanted && onScreen && !document.hidden) {
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      video.pause();
    }
  }

  soundBtn.addEventListener("click", function () {
    video.muted = !video.muted;
    if (!video.muted) wanted = true;
    soundBtn.textContent = video.muted ? "Sound on" : "Sound off";
    sync();
  });

  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      sync();
    }).observe(video);
  }
  document.addEventListener("visibilitychange", sync);
  sync();
})();
</script>
