<title>Michigan Ave</title>
<style>
  :root {
    --page-pad: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 2rem clamp(1rem, 4vw, 3rem) 36px;
  }

  /* Labs nav, styled as tabs: one page per tab. */
  .tabs {
    display: flex;
    flex-wrap: wrap;   /* six tabs, and Rain on grass is long on a phone */
    gap: 1.5rem;
    padding: 1.25rem clamp(1rem, 4vw, 3rem) 0;
  }

  .tabs a {
    padding: 0.5rem 0;
    border-bottom: 1px solid transparent;
    color: #8a8a8a;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
  }

  .tabs a:hover { color: #f2efe9; }

  .tabs a[aria-current="page"] {
    color: #f2efe9;
    border-bottom-color: #f2efe9;
  }

  .tabs a:focus-visible {
    outline: 2px solid #f2efe9;
    outline-offset: 4px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0.5rem 0 0;
    font-size: 0.875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8a8a;
  }

  /* The footage sits behind a curtain of lines and only shows where the
     pointer parts it. */
  .stage {
    position: relative;
    margin: 0 var(--page-pad);
    height: min(56.25vw, 78vh);
    min-height: 200px;
    background: #000;
    overflow: hidden;
    touch-action: pan-y;
    -webkit-touch-callout: none;
    user-select: none;
  }

  .stage canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Kept rendered (not display:none) so every browser keeps decoding frames. */
  .stage video {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .stage-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem var(--page-pad) 0;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }

  .stage-bar button {
    padding: 0.4rem 0.9rem;
    border: 1px solid #3a3a3a;
    border-radius: 999px;
    background: none;
    color: #f2efe9;
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
  }

  .stage-bar button:hover { border-color: #8a8a8a; }

  .stage-bar button:focus-visible {
    outline: 2px solid #f2efe9;
    outline-offset: 2px;
  }

  footer {
    padding: 2rem clamp(1rem, 4vw, 3rem) 3rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }

<main>
<section id="movements">
<header>
  <h1>Michigan Ave</h1>
  <p>Movements</p>
</header>

<div class="stage">
  <canvas class="picture" aria-hidden="true"></canvas>
  <canvas class="curtain" role="img"
          aria-label="A curtain of yellow and orange lines drifting in opposite directions. Move the pointer over it and the lines part to show a busy Michigan Avenue corner in slow motion, in black and white; move away and they sway closed."></canvas>
  <video src="../assets/video/michigan-ave.mp4" poster="../assets/video/michigan-ave.jpg"
         muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
  <audio src="../assets/video/michigan-ave-street.m4a" loop preload="auto"></audio>
</div>
<div class="stage-bar">
  <button type="button" class="stage-sound">Sound on</button>
  <button type="button" class="stage-toggle" aria-pressed="false">Pause</button>
</div>
</section>
</main>

<footer>PDL 2026</footer>

<script>
/* Michigan Ave: the street footage (10x, played back at 0.4, so slow motion
   at four times life) hangs behind two layers of lines, yellow drifting right
   and orange drifting left, each at half opacity. Under the pointer the lines
   part and fade to 5%, and the footage shows only where they are open, with
   old-film grain on it. When the pointer moves on, the lines sway back and
   the opening closes. The street sound is a separate track at normal speed;
   with Sound on it fades in while the pointer moves over the picture and
   out when it stops. Like the other Movements, everything pauses while the
   stage is off screen or the tab is in the background. */
(function () {
  "use strict";

  var stage = document.querySelector(".stage");
  var curtain = stage.querySelector(".curtain");
  var ctx = curtain.getContext("2d");
  var picture = stage.querySelector(".picture");
  var pctx = picture.getContext("2d");
  var video = stage.querySelector("video");
  var street = stage.querySelector("audio");
  var toggle = document.querySelector(".stage-toggle");
  var soundBtn = document.querySelector(".stage-sound");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var paused = reduced, onScreen = true, soundWanted = false;

  /* Line patterns, as [x, width] in the pixels of the two reference strips. */
  var LAYERS = [
    { ref: 1312, dir: 1, rgb: "255, 217, 0", bars: [[0,33],[49,11],[87,50],[183,6],[216,25],[258,14],[323,22],[362,35],[414,10],[451,13],[481,6],[513,26],[555,44],[621,22],[665,22],[709,44],[769,25],[821,6],[844,13],[883,11],[910,36],[962,22],[1036,14],[1067,25],[1119,6],[1171,50],[1248,10],[1275,35]] },
    { ref: 1272, dir: -1, rgb: "255, 118, 0", bars: [[27,33],[76,10],[111,47],[201,5],[231,24],[270,14],[332,20],[368,33],[417,9],[451,12],[479,6],[510,23],[549,40],[610,21],[651,21],[693,40],[749,23],[797,6],[819,12],[856,10],[881,33],[930,20],[999,13],[1027,24],[1076,5],[1124,47],[1196,10],[1222,33]] }
  ];
  var SLOW = 0.4;             // playback rate of the footage
  var PERIOD = 12.10667;      // seconds for a layer to cross the stage once
  var BASE_ALPHA = 0.5;       // each layer at 50%, so overlaps reach 75%
  var NEAR_ALPHA = 0.05;      // opacity right under the pointer
  var NODE = 8;               // px between points along each line

  /* Each line is a hanging strand: points pulled home by a soft spring, tied
     to their neighbours by tension (so a push ripples up and down), lightly
     damped so it sways back with a little overshoot. */
  var HOME = 7, HOME_DAMP = 2.6, TENSION = 900, GRAB = 140, DRAG = 0.10;
  var FADE_IN = 0.18, FADE_OUT = 1.6;   // s: how fast an opening opens / closes
  var STEPS = 4;                        // physics substeps per frame

  var w = 0, h = 0, dpr = 1, nodes = 0, strands = [];
  var raf = 0, last = 0, clock = 0;
  var pointer = { x: 0, y: 0, px: 0, py: 0, inside: false, lastMove: -1e9 };
  var field = { x: 0, y: 0, vx: 0, strength: 0 };   // the pointer, smoothed

  /* Where the curtain is open: a coarse grid that opens quickly under the
     pointer and closes at the pace the strands settle back. It masks the
     footage. */
  var GW = 96, GH = 54, open = new Float32Array(GW * GH);
  var mask = document.createElement("canvas");
  mask.width = GW; mask.height = GH;
  var mctx = mask.getContext("2d");
  var maskImg = mctx.createImageData(GW, GH);
  var shown = false;

  function smooth(t) { return t * t * (3 - 2 * t); }

  function measure() {
    w = stage.clientWidth;
    h = stage.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    curtain.width = picture.width = Math.round(w * dpr);
    curtain.height = picture.height = Math.round(h * dpr);
    var n = Math.ceil(h / NODE) + 1;
    if (n !== nodes) {
      nodes = n;
      strands = LAYERS.map(function (l) {
        var list = [];
        for (var i = 0; i < l.bars.length * 2; i++) {
          list.push({ dx: new Float32Array(n), v: new Float32Array(n), e: new Float32Array(n), awake: false });
        }
        return list;
      });
    }
    buildGrain();
    shown = true;   // force a clear of the picture
  }

  /* Old-film grain: a few frames of noise, flicker, dust, the odd hair and a
     wandering scratch, redrawn 24 times a second and laid over the footage. */
  var grain = document.createElement("canvas");
  var gctx = grain.getContext("2d");
  var grainTiles = [], scratch = null, lastGrain = 0;

  function buildGrain() {
    var gw = Math.max(1, Math.round(w / 1.6)), gh = Math.max(1, Math.round(h / 1.6));
    grain.width = gw; grain.height = gh;
    grainTiles = [];
    for (var f = 0; f < 8; f++) {
      var c = document.createElement("canvas");
      c.width = gw; c.height = gh;
      var g = c.getContext("2d"), img = g.createImageData(gw, gh), d = img.data;
      for (var i = 0; i < d.length; i += 4) {
        var r = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
        d[i] = d[i + 1] = d[i + 2] = Math.max(0, Math.min(255, 128 + r * 110));
        d[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      grainTiles.push(c);
    }
    drawGrain();
  }

  function drawGrain() {
    var gw = grain.width, gh = grain.height;
    var fx = Math.random() < 0.5, fy = Math.random() < 0.5;
    gctx.save();
    gctx.translate(fx ? gw : 0, fy ? gh : 0);
    gctx.scale(fx ? -1 : 1, fy ? -1 : 1);
    gctx.drawImage(grainTiles[(Math.random() * grainTiles.length) | 0], 0, 0);
    gctx.restore();
    var fl = (Math.random() - 0.5) * 0.09;   // exposure flicker
    gctx.fillStyle = fl > 0 ? "rgba(255,255,255," + fl + ")" : "rgba(0,0,0," + (-fl) + ")";
    gctx.fillRect(0, 0, gw, gh);
    var specks = Math.random() < 0.55 ? 1 + ((Math.random() * 4) | 0) : 0;
    for (var i = 0; i < specks; i++) {
      gctx.fillStyle = Math.random() < 0.6 ? "rgba(0,0,0,0.9)" : "rgba(255,255,255,0.85)";
      gctx.beginPath();
      gctx.ellipse(Math.random() * gw, Math.random() * gh, 0.6 + Math.random() * 2.2,
                   0.6 + Math.random() * 1.6, Math.random() * Math.PI, 0, Math.PI * 2);
      gctx.fill();
    }
    if (Math.random() < 0.025) {
      var x = Math.random() * gw, y = Math.random() * gh, len = 12 + Math.random() * 40;
      gctx.strokeStyle = "rgba(0,0,0,0.85)";
      gctx.lineWidth = 0.7;
      gctx.beginPath();
      gctx.moveTo(x, y);
      gctx.bezierCurveTo(x + (Math.random() - 0.5) * len, y + len * 0.3,
                         x + (Math.random() - 0.5) * len, y + len * 0.7,
                         x + (Math.random() - 0.5) * len, y + len);
      gctx.stroke();
    }
    if (!scratch && Math.random() < 0.01) scratch = { x: Math.random() * gw, life: 20 + Math.random() * 60 };
    if (scratch) {
      scratch.x += (Math.random() - 0.5) * 1.2;
      gctx.fillStyle = "rgba(255,255,255," + (0.35 + Math.random() * 0.35) + ")";
      gctx.fillRect(scratch.x, 0, 0.6, gh);
      if (--scratch.life <= 0) scratch = null;
    }
  }

  function stepStrand(s, cx, radius, push, dt) {
    var dx = s.dx, v = s.v, e = s.e, energy = 0;
    var kIn = 1 - Math.exp(-dt / FADE_IN), kOut = 1 - Math.exp(-dt / FADE_OUT);
    for (var i = 0; i < nodes; i++) {
      var infl = 0, target = 0;
      if (field.strength > 0.001) {
        var d = Math.sqrt(Math.pow(cx + dx[i] * 0.35 - field.x, 2) + Math.pow((i * NODE - field.y) * 0.9, 2));
        if (d < radius) {
          infl = smooth(1 - d / radius) * field.strength;
          target = (cx < field.x ? -1 : 1) * push * infl + field.vx * DRAG * infl;
        }
      }
      var up = i > 0 ? dx[i - 1] : dx[i], down = i < nodes - 1 ? dx[i + 1] : dx[i];
      var acc = -HOME * dx[i] + GRAB * infl * (target - dx[i])
        + TENSION / (NODE * NODE) * 8 * (up + down - 2 * dx[i])
        - (HOME_DAMP + 2 * Math.sqrt(GRAB) * 0.8 * infl) * v[i];
      v[i] += acc * dt;
      e[i] += (infl - e[i]) * (infl > e[i] ? kIn : kOut);
      energy += Math.abs(v[i]) + Math.abs(dx[i]) + e[i] * 10;
    }
    for (i = 0; i < nodes; i++) dx[i] += v[i] * dt;
    return energy;
  }

  /* A smooth outline through the strand's points, filled with a gradient
     that carries each point's opacity. */
  function drawStrand(s, x, bw, rgb) {
    var dx = s.dx, e = s.e, i, bottom = (nodes - 1) * NODE;
    ctx.beginPath();
    ctx.moveTo(x + dx[0], 0);
    for (i = 1; i < nodes; i++) {
      ctx.quadraticCurveTo(x + dx[i - 1], (i - 1) * NODE, x + (dx[i - 1] + dx[i]) / 2, (i - 0.5) * NODE);
    }
    ctx.lineTo(x + dx[nodes - 1], bottom);
    ctx.lineTo(x + bw + dx[nodes - 1], bottom);
    for (i = nodes - 1; i > 0; i--) {
      ctx.quadraticCurveTo(x + bw + dx[i], i * NODE, x + bw + (dx[i - 1] + dx[i]) / 2, (i - 0.5) * NODE);
    }
    ctx.lineTo(x + bw + dx[0], 0);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, 0, 0, bottom);
    for (i = 0; i < nodes; i += 2) {
      var a = BASE_ALPHA + (NEAR_ALPHA - BASE_ALPHA) * Math.min(1, e[i]);
      g.addColorStop(Math.min(1, (i * NODE) / bottom), "rgba(" + rgb + ", " + a.toFixed(3) + ")");
    }
    ctx.fillStyle = g;
    ctx.fill();
  }

  /* The footage, cover-cropped into the stage, with grain, masked to the
     open areas. */
  function drawPicture(peak) {
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.globalCompositeOperation = "source-over";
    pctx.clearRect(0, 0, w, h);
    if (peak <= 0) { shown = false; return; }
    var src = null, sw = 0, sh = 0;
    if (video.readyState >= 2 && video.videoWidth) { src = video; sw = video.videoWidth; sh = video.videoHeight; }
    if (src) {
      var scale = Math.max(w / sw, h / sh), cw = w / scale, ch = h / scale;
      pctx.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, w, h);
    }
    pctx.globalCompositeOperation = "overlay";
    pctx.globalAlpha = 0.6;
    pctx.drawImage(grain, 0, 0, w, h);
    pctx.globalAlpha = 1;
    mctx.putImageData(maskImg, 0, 0);
    pctx.globalCompositeOperation = "destination-in";
    pctx.drawImage(mask, 0, 0, w, h);
    pctx.globalCompositeOperation = "source-over";
    shown = true;
  }

  function active() { return onScreen && !document.hidden; }

  function frame(now) {
    raf = 0;
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;
    if (!paused) clock += dt;

    /* The field trails the real pointer a little, which keeps it soft. */
    var follow = 1 - Math.exp(-dt / 0.07);
    if (pointer.inside) {
      var nx = field.x + (pointer.x - field.x) * follow;
      field.vx += ((nx - field.x) / Math.max(dt, 0.001) - field.vx) * (1 - Math.exp(-dt / 0.1));
      field.x = nx;
      field.y += (pointer.y - field.y) * follow;
    } else {
      field.vx *= Math.exp(-dt / 0.1);
    }
    field.strength += ((pointer.inside ? 1 : 0) - field.strength) *
      (1 - Math.exp(-dt / (pointer.inside ? 0.15 : 0.35)));

    var radius = Math.max(w * 0.17, 90), push = w * 0.07, sub = dt / STEPS, moving = false;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    LAYERS.forEach(function (layer, li) {
      var scale = w / layer.ref, phase = (clock / PERIOD) % 1;
      var offset = layer.dir > 0 ? -w + phase * w : -phase * w;
      var solid = "rgba(" + layer.rgb + ", " + BASE_ALPHA + ")";
      for (var copy = 0; copy < 2; copy++) {
        layer.bars.forEach(function (bar, bi) {
          var x = offset + copy * w + bar[0] * scale, bw = bar[1] * scale;
          var s = strands[li][copy * layer.bars.length + bi], cx = x + bw / 2;
          var near = field.strength > 0.001 && Math.abs(cx - field.x) < radius + push;
          if ((near || s.awake) && dt > 0) {
            var energy = 0;
            for (var k = 0; k < STEPS; k++) energy = stepStrand(s, cx, radius, push, sub);
            s.awake = near || energy > 0.02 * nodes;
            if (!s.awake) { s.dx.fill(0); s.v.fill(0); s.e.fill(0); }
          }
          if (s.awake) moving = true;
          if (x + bw + push < 0 || x - push > w) return;
          if (s.awake) drawStrand(s, x, bw, layer.rgb);
          else { ctx.fillStyle = solid; ctx.fillRect(x, 0, bw, h); }
        });
      }
    });

    /* Open areas of the curtain, for the mask. */
    var kIn = 1 - Math.exp(-dt / FADE_IN), kOut = 1 - Math.exp(-dt / FADE_OUT), peak = 0;
    for (var gy = 0; gy < GH; gy++) {
      var y = (gy + 0.5) * h / GH;
      for (var gx = 0; gx < GW; gx++) {
        var t = 0, i = gy * GW + gx;
        if (field.strength > 0.001) {
          var d = Math.sqrt(Math.pow((gx + 0.5) * w / GW - field.x, 2) + Math.pow((y - field.y) * 0.9, 2));
          if (d < radius) t = Math.min(1, Math.max(0, (smooth(1 - d / radius) - 0.08) / 0.55)) * field.strength;
        }
        open[i] += (t - open[i]) * (t > open[i] ? kIn : kOut);
        if (open[i] < 0.002) open[i] = 0;
        maskImg.data[i * 4 + 3] = open[i] * 255;
        if (open[i] > peak) peak = open[i];
      }
    }
    if (!paused && now - lastGrain > 1000 / 24) { lastGrain = now; drawGrain(); }
    if (peak > 0 || shown) drawPicture(peak);

    fadeSound(now);

    if (active() && (!paused || moving || peak > 0 || pointer.inside)) raf = requestAnimationFrame(frame);
    else last = 0;
  }

  function kick() {
    if (!raf && active()) raf = requestAnimationFrame(frame);
  }

  /* Sound: the street recording through a gain that rises while the pointer
     moves over the picture and falls away once it stops. Sound starts off;
     the Sound on press is the click browsers require before audio may
     play. Without Web Audio (or before it starts) the track plays at full
     level with no fade. */
  var ac = null, gain = null, loud = false;
  var RISE = 0.25, FALL = 0.7, STILL = 180;   // s, s, ms without movement

  function buildAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      var node = ac.createGain();
      node.gain.value = 0;
      ac.createMediaElementSource(street).connect(node);
      node.connect(ac.destination);
      gain = node.gain;
    } catch (e) { ac = null; gain = null; }
  }

  function fadeSound(now) {
    if (!gain) return;
    var want = soundWanted && !paused && pointer.inside && now - pointer.lastMove < STILL;
    if (want === loud) return;
    loud = want;
    gain.setTargetAtTime(want ? 1 : 0, ac.currentTime, want ? RISE : FALL);
  }

  function sync() {
    var live = active();
    if (live && !paused) {
      video.playbackRate = SLOW;
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      video.pause();
    }
    if (live && !paused && soundWanted) {
      if (ac && ac.state !== "running") ac.resume();
      var q = street.play();
      if (q && q.catch) q.catch(function () {});
    } else {
      street.pause();
    }
    toggle.textContent = paused ? "Play" : "Pause";
    toggle.setAttribute("aria-pressed", paused ? "true" : "false");
    kick();
  }

  function point(e) {
    var box = stage.getBoundingClientRect();
    var x = e.clientX - box.left, y = e.clientY - box.top;
    if (!pointer.inside) { field.x = x; field.y = y; field.vx = 0; }
    else if (Math.abs(x - pointer.x) + Math.abs(y - pointer.y) > 0.5) pointer.lastMove = performance.now();
    pointer.x = x;
    pointer.y = y;
    pointer.inside = true;
    kick();
  }
  function lift(e) {
    if (e.type === "pointerleave" || e.pointerType !== "mouse") pointer.inside = false;
    kick();
  }
  stage.addEventListener("pointermove", point);
  stage.addEventListener("pointerdown", point);
  stage.addEventListener("pointerup", lift);
  stage.addEventListener("pointercancel", lift);
  stage.addEventListener("pointerleave", lift);
  stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* The playback rate is reset by some browsers when a source loads. */
  video.addEventListener("loadedmetadata", function () { video.playbackRate = SLOW; });
  video.addEventListener("play", function () { video.playbackRate = SLOW; });

  if ("ResizeObserver" in window) new ResizeObserver(function () { measure(); kick(); }).observe(stage);
  else addEventListener("resize", function () { measure(); kick(); });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      sync();
    }).observe(stage);
  }
  document.addEventListener("visibilitychange", sync);

  toggle.addEventListener("click", function () {
    paused = !paused;
    sync();
  });

  /* The button names the action it takes, so it carries no aria-pressed. */
  soundBtn.addEventListener("click", function () {
    soundWanted = !soundWanted;
    if (soundWanted && !ac) buildAudio();
    soundBtn.textContent = soundWanted ? "Sound off" : "Sound on";
    sync();
  });

  measure();
  sync();
})();
</script>
