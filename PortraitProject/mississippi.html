<title>Mississippi</title>
<style>
  :root {
    --page-pad: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 2rem clamp(1rem, 4vw, 3rem) 36px;
  }

  /* Labs nav, styled as tabs: one page per tab. */
  .tabs {
    display: flex;
    flex-wrap: wrap;   /* eleven tabs, and Rain on grass is long on a phone */
    gap: 1.5rem;
    padding: 1.25rem clamp(1rem, 4vw, 3rem) 0;
  }

  .tabs a {
    padding: 0.5rem 0;
    border-bottom: 1px solid transparent;
    color: #8a8a8a;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
  }

  .tabs a:hover { color: #f2efe9; }

  .tabs a[aria-current="page"] {
    color: #f2efe9;
    border-bottom-color: #f2efe9;
  }

  .tabs a:focus-visible {
    outline: 2px solid #f2efe9;
    outline-offset: 4px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0.5rem 0 0;
    font-size: 0.875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8a8a;
  }

  /* Portrait footage, 4:5: as tall as the other stages (78% of the
     window) and centred. */
  .frame {
    width: min(calc(100vw - 2 * var(--page-pad)), calc(78vh * 0.8));
    margin: 0 auto;
  }

  .stage {
    aspect-ratio: 4 / 5;
    background: #000 url("../assets/video/mississippi.jpg") center / cover no-repeat;
  }

  .stage { position: relative; isolation: isolate; }

  /* The word: its letters stream out of the cursor while the pointer is
     over the stage, drawn on a canvas in a translucent dark colour taken from the
     footage around the cursor. */
  .burst {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .stage video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* The controls sit above the stage, at its right edge, where they are
     seen first. They are outside the stage, so pressing them never reaches
     the stage's own pointer handlers. */
  .stage-wrap { position: relative; }

  /* Full screen: the whole player — the bar, then the stage filling the
     rest of the screen, the footage letterboxed whole inside it. */
  .stage-wrap:fullscreen {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 1rem clamp(1rem, 4vw, 3rem) 1.5rem;
    background: #000;
  }
  .stage-wrap:-webkit-full-screen {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 1rem clamp(1rem, 4vw, 3rem) 1.5rem;
    background: #000;
  }
  .stage-wrap:fullscreen .stage { flex: 1; min-height: 0; aspect-ratio: auto; background: #000; }
  .stage-wrap:-webkit-full-screen .stage { flex: 1; min-height: 0; aspect-ratio: auto; background: #000; }
  .stage-wrap:fullscreen .stage video { object-fit: contain; }
  .stage-wrap:-webkit-full-screen .stage video { object-fit: contain; }

  .stage-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.5rem;
    padding: 0 0 0.75rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }

  /* The music credit, in the footer on its own line above PDL 2026. */
  .credit { display: block; margin-bottom: 0.5rem; }

  .stage-bar button {
    padding: 0.4rem 0.9rem;
    border: 1px solid rgba(242, 239, 233, 0.35);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: #f2efe9;
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
  }

  .stage-bar button:hover { border-color: #f2efe9; background: rgba(0, 0, 0, 0.75); }

  .stage-bar button:focus-visible {
    outline: 2px solid #f2efe9;
    outline-offset: 2px;

<main>
<section id="mississippi">
<header>
  <h1>Mississippi</h1>
  <p>Movements</p>
</header>

<div class="frame stage-wrap">
  <div class="stage-bar">
    <button type="button" class="stage-play" aria-pressed="false">Play</button>
    <button type="button" class="stage-full" hidden>Full screen</button>
  </div>
  <div class="stage">
    <video src="../assets/video/mississippi.mp4" poster="../assets/video/mississippi.jpg"
           playsinline preload="metadata" disablepictureinpicture
           aria-label="Mississippi: a halftone video piece with its soundtrack."></video>
    <canvas class="burst" aria-hidden="true"></canvas>
  </div>
</div>

<footer><span class="credit">Music: Fly Rich</span> PDL 2026</footer>

<script>
/* Mississippi: waits paused on its first frame. Play starts it with its
   soundtrack; it plays once and stops on its last frame. Play again
   starts it over from the beginning. */
(function () {
  "use strict";

  var video = document.querySelector(".stage video");
  var btn = document.querySelector(".stage-play");

  function label() {
    var playing = !video.paused && !video.ended;
    btn.textContent = playing ? "Pause" : "Play";
    btn.setAttribute("aria-pressed", playing ? "true" : "false");
  }

  btn.addEventListener("click", function () {
    if (video.paused || video.ended) {
      if (video.ended) video.currentTime = 0;
      video.muted = false;
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      video.pause();
    }
  });

  ["play", "playing", "pause", "ended"].forEach(function (e) {
    video.addEventListener(e, label);
  });
  label();

  /* Full screen takes the whole player, letters and all. Where only the
     video itself can go full screen (iPhone), that is used instead. */
  var wrap = document.querySelector(".stage-wrap");
  var full = document.querySelector(".stage-full");
  var canWrap = !!(wrap.requestFullscreen || wrap.webkitRequestFullscreen);
  var canVideo = !!video.webkitEnterFullscreen;
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }

  if (canWrap || canVideo) {
    full.hidden = false;
    full.addEventListener("click", function () {
      if (fsEl()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (canWrap) {
        var p = (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
        if (p && p.catch) p.catch(function () {});
      } else {
        video.webkitEnterFullscreen();
      }
    });
    function fsLabel() { full.textContent = fsEl() ? "Exit full screen" : "Full screen"; }
    document.addEventListener("fullscreenchange", fsLabel);
    document.addEventListener("webkitfullscreenchange", fsLabel);
  }
})();
</script>

<script>
/* The word. While the pointer is over the stage, the letters of
   "Mississippi" stream out of it, one after another in order, each
   blasting away from the cursor, spinning, speeding up and swelling
   until it is huge by the time it has
   left the frame; none ever stays. With the video playing, each beat of
   the song (mississippi-track.json) sets off an extra burst, bigger when
   the song is loud. When the pointer leaves, the stream stops and the
   letters already in flight finish their way out. On a touch screen,
   touching and dragging does the same. */
(function () {
  "use strict";

  var stage = document.querySelector(".stage");
  var video = stage.querySelector("video");
  var cv = stage.querySelector(".burst");
  var ctx = cv.getContext("2d");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var WORD = "Mississippi";
  var FONT = '"Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", sans-serif';
  /* Colour comes from the footage, from where the letters are born. Ten
     times a second the current frame is read at a small size, and the
     dark tones around the cursor (the darkest third of the patch, leaving
     out flat black) become the base colour; if the patch is all black,
     the whole frame is used instead. Each letter keeps the colour it was
     born with, all the way out. */
  var ALPHA = 0.45;
  var base = [52, 24, 14], want = base.slice();
  var probe = document.createElement("canvas");
  probe.width = 48; probe.height = 60;
  var pctx = probe.getContext("2d", { willReadFrequently: true });
  var lastProbe = -1;

  function darkTone(d, x0, y0, x1, y1) {
    var px = [];
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) {
      var i = (y * probe.width + x) * 4;
      var lum = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
      if (lum > 10) px.push([lum, d[i], d[i + 1], d[i + 2]]);
    }
    if (px.length < 6) return null;
    px.sort(function (a, b) { return a[0] - b[0]; });
    var n = Math.max(3, Math.floor(px.length / 3)), r = 0, g = 0, b = 0;
    for (var k = 0; k < n; k++) { r += px[k][1]; g += px[k][2]; b += px[k][3]; }
    return [r / n, g / n, b / n];
  }

  function sample(now) {
    if (now - lastProbe < 100 || video.readyState < 2) return;
    lastProbe = now;
    try {
      var w = probe.width, h = probe.height;
      pctx.drawImage(video, 0, 0, w, h);
      var d = pctx.getImageData(0, 0, w, h).data;
      /* where the cursor sits in the picture, as the picture is shown:
         cropped to fill the stage, or letterboxed in full screen */
      var vw = video.videoWidth || 4, vh = video.videoHeight || 5, ar = vw / vh;
      var cover = getComputedStyle(video).objectFit === "cover";
      var bw = (cover ? SW > ar : SW < ar) ? SW : ar, bh = bw / ar;
      var fx = (cur.x - (SW - bw) / 2) / bw, fy = (cur.y - (1 - bh) / 2) / bh;
      var cx = Math.round(Math.max(0, Math.min(1, fx)) * w), cy = Math.round(Math.max(0, Math.min(1, fy)) * h), rad = 7;
      var c = darkTone(d, Math.max(0, cx - rad), Math.max(0, cy - rad), Math.min(w, cx + rad), Math.min(h, cy + rad)) ||
              darkTone(d, 0, 0, w, h);
      if (c) want = c;
    } catch (e) {}
  }
  /* glide toward the newest sample, so the colour never flickers */
  function settle(dt) {
    var k = Math.min(1, dt / 0.2);
    for (var i = 0; i < 3; i++) base[i] += (want[i] - base[i]) * k;
  }

  function tint(L) {
    var c = L.c;
    return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + ALPHA + ")";
  }
  var PI = Math.PI;

  var T = null;
  fetch("../assets/video/mississippi-track.json")
    .then(function (r) { return r.json(); })
    .then(function (d) { T = d; })
    .catch(function () {});

  function rmsAt(t) {
    if (!T) return 0.45;
    var i = Math.max(0, Math.min(T.rms.length - 1, Math.floor(t * T.rate)));
    return T.rms[i];
  }
  function beatAt(t) {
    if (!T) return t * 129.2 / 60;
    var b = T.beats, n = b.length, per = 60 / T.bpm;
    if (t <= b[0]) return (t - b[0]) / per;
    if (t >= b[n - 1]) return n - 1 + (t - b[n - 1]) / per;
    var lo = 0, hi = n - 1;
    while (hi - lo > 1) { var m = (lo + hi) >> 1; if (b[m] <= t) lo = m; else hi = m; }
    return lo + (t - b[lo]) / (b[hi] - b[lo]);
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* Positions are in stage heights: x runs 0..SW (0.8 on the page,
     where the stage is 4:5; wider in full screen), y runs 0..1 down. */
  var SW = 0.8;

  var letters = [], next = 0, owed = 0;
  var cur = { x: SW / 2, y: 0.5 };

  /* One letter out of the cursor: the next letter of the word, thrown in
     a random direction, spinning. */
  function emit(power) {
    var ch = WORD[next];
    next = (next + 1) % WORD.length;
    var a = rnd(0, 2 * PI), sp = rnd(0.45, 1.1) * power;
    letters.push({
      ch: ch,
      x: cur.x, y: cur.y, ox: cur.x, oy: cur.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: rnd(-0.4, 0.4), vr: rnd(-7, 7) * power,
      c: base.slice(),
      s: 0.2, size: ch === "M" ? rnd(0.26, 0.34) : rnd(0.14, 0.26)
    });
  }

  /* ---- loop ----------------------------------------------------------- */

  function fit() {
    var r = stage.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    SW = w / h;
  }
  if ("ResizeObserver" in window) new ResizeObserver(fit).observe(stage);
  else window.addEventListener("resize", fit);
  fit();

  var shown = false, running = false, last = 0, lastBeat = null;

  function step(dt) {
    var playing = !video.paused && !video.ended;
    var E = playing ? Math.max(0.5, Math.min(1.2, 0.3 + rmsAt(video.currentTime) * 1.6)) : 0.7;

    if (shown) {
      /* a steady stream, faster when the song is loud */
      owed += dt * (reduced ? 4 : 22 + 16 * E);
      while (owed >= 1) { emit(reduced ? 0.35 : E); owed -= 1; }

      /* and a burst on every beat */
      if (playing && !reduced) {
        var b = Math.floor(beatAt(video.currentTime));
        if (lastBeat !== null && b !== lastBeat) {
          var acc = T && T.accent[b] != null ? T.accent[b] : 0.5;
          var n = Math.round(2 + 4 * acc * E);
          for (var k = 0; k < n; k++) emit(E * 1.35);
        }
        lastBeat = b;
      } else lastBeat = null;
    } else lastBeat = null;

    for (var i = letters.length - 1; i >= 0; i--) {
      var L = letters[i];
      /* pushed ever outward, so nothing slows to a stop inside the frame */
      var boost = 1 + (reduced ? 0.3 : 1.3) * dt;
      L.vx *= boost; L.vy *= boost;
      L.x += L.vx * dt; L.y += L.vy * dt;
      L.r += L.vr * dt;
      /* growth follows distance travelled, steepening as it goes, so
         a letter born small is huge by the time it reaches the edge */
      var dx = L.x - L.ox, dy = L.y - L.oy, d = Math.sqrt(dx * dx + dy * dy);
      L.s = Math.min(7, 0.2 + 10 * Math.pow(d, 1.5));

      var m = L.size * L.s * 0.75;
      if (L.y - m > 1 || L.y + m < 0 || L.x + m < 0 || L.x - m > SW) letters.splice(i, 1);
    }
  }

  function draw() {
    var H = cv.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < letters.length; i++) {
      var L = letters[i];
      ctx.fillStyle = tint(L);
      ctx.setTransform(L.s, 0, 0, L.s, L.x * H, L.y * H);
      ctx.rotate(L.r);
      ctx.font = "bold " + Math.round(L.size * H) + "px " + FONT;
      ctx.fillText(L.ch, 0, 0);
    }
  }

  function frame(now) {
    var dt = Math.min(0.033, last ? (now - last) / 1000 : 0.016);
    last = now;
    sample(now);
    settle(dt);
    step(dt);
    draw();
    if (shown || letters.length) requestAnimationFrame(frame);
    else { running = false; last = 0; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); }
  }

  function track(e) {
    var r = stage.getBoundingClientRect();
    cur.x = (e.clientX - r.left) / r.height;
    cur.y = (e.clientY - r.top) / r.height;
  }

  function show(on) {
    if (on === shown) return;
    shown = on;
    owed = on ? 1 : 0;
    if (on && !running) { running = true; requestAnimationFrame(frame); }
  }

  stage.addEventListener("pointerenter", function (e) { track(e); show(true); });
  stage.addEventListener("pointermove", track);
  stage.addEventListener("pointerdown", function (e) { if (e.pointerType === "touch") { track(e); show(true); } });
  stage.addEventListener("pointerup", function (e) { if (e.pointerType === "touch") show(false); });
  stage.addEventListener("pointercancel", function () { show(false); });
  stage.addEventListener("pointerleave", function () { show(false); });
})();
</script>

</body>
