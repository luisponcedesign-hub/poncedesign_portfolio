<main>
<section id="movements">
<header>
  <h1>Caterpillar</h1>
  <p>Movements</p>
</header>

<div class="stage">
  <video src="../assets/video/caterpillar.mp4" poster="../assets/video/caterpillar.jpg"
         muted loop playsinline preload="auto" disablepictureinpicture
         aria-label="A grub crawling across asphalt, its body in warm yellow against a black and white ground, with the sound of slow wind"></video>
</div>
<div class="stage-bar">
  <button type="button" class="stage-sound">Sound on</button>
  <button type="button" class="stage-toggle" aria-pressed="false">Pause</button>
</div>
</section>
</main>

<footer>PDL 2026</footer>

<script>
/* Caterpillar: the clip plays muted on a loop while it is on screen, like the
   other Movements. Sound starts off; the Sound on press is the click browsers
   require before audio may play. */
(function () {
  "use strict";

  var video = document.querySelector(".stage video");
  var toggle = document.querySelector(".stage-toggle");
  var soundBtn = document.querySelector(".stage-sound");
  var paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var onScreen = true;

  function sync() {
    if (onScreen && !document.hidden && !paused) {
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      video.pause();
    }
    toggle.textContent = paused ? "Play" : "Pause";
    toggle.setAttribute("aria-pressed", paused ? "true" : "false");
  }

  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      sync();
    }).observe(video);
  }
  document.addEventListener("visibilitychange", sync);

  toggle.addEventListener("click", function () {
    paused = !paused;
    sync();
  });

  /* The button names the action it takes, so it carries no aria-pressed. */
  soundBtn.addEventListener("click", function () {
    video.muted = !video.muted;
    soundBtn.textContent = video.muted ? "Sound on" : "Sound off";
  });

  sync();
})();
</script>

</body>
