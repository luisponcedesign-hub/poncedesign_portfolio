<title>Caterpillar</title>
<style>
  :root {
    --page-pad: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 2rem clamp(1rem, 4vw, 3rem) 36px;
  }

  /* Labs nav, styled as tabs: one page per tab. */
  .tabs {
    display: flex;
    flex-wrap: wrap;   /* six tabs, and Rain on grass is long on a phone */
    gap: 1.5rem;
    padding: 1.25rem clamp(1rem, 4vw, 3rem) 0;
  }

  .tabs a {
    padding: 0.5rem 0;
    border-bottom: 1px solid transparent;
    color: #8a8a8a;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
  }

  .tabs a:hover { color: #f2efe9; }

  .tabs a[aria-current="page"] {
    color: #f2efe9;
    border-bottom-color: #f2efe9;
  }

  .tabs a:focus-visible {
    outline: 2px solid #f2efe9;
    outline-offset: 4px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0.5rem 0 0;
    font-size: 0.875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8a8a;
  }

  /* Unlike the other Movements, this footage is shown as it is. */
  .stage {
    margin: 0 var(--page-pad);
    height: min(56.25vw, 78vh);
    min-height: 200px;
    background: #000;
    touch-action: pan-y;
    -webkit-touch-callout: none;
    user-select: none;
  }

  .stage video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .stage-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem var(--page-pad) 0;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6a6a6a;
  }

  .stage-bar button {
    padding: 0.4rem 0.9rem;

    border-radius: 999px;
    background: none;

    letter-spacing: inherit;
    cursor: pointer;
  }

  .stage-bar button:hover { border-color: #8a8a8a; }

  .stage-bar button:focus-visible {

    outline-offset: 2px;
  }

  footer {

<body>

<nav class="tabs" aria-label="PonceDesign Labs">

<main>
<section id="movements">
<header>
  <h1>Caterpillar</h1>
  <p>Movements</p>
</header>

<div class="stage">
  <video src="../assets/video/caterpillar.mp4?v=2" poster="../assets/video/caterpillar.jpg"
         muted loop playsinline preload="auto" disablepictureinpicture
         aria-label="A grub crawling across asphalt, its body in warm yellow against a black and white ground. Rest the pointer on it and it stops; the wind carries on."></video>
  <audio src="../assets/video/caterpillar-wind.m4a" loop preload="auto"></audio>
</div>
<div class="stage-bar">
  <button type="button" class="stage-sound">Sound on</button>
  <button type="button" class="stage-toggle" aria-pressed="false">Pause</button>
</div>
</section>
</main>

<footer>PDL 2026</footer>

<script>
/* Caterpillar: the clip plays muted on a loop while it is on screen, like the
   other Movements. Rest the pointer on the insect (or hold a finger on it)
   and it stops for a while; move away and it carries on. The wind is a
   separate track, so it keeps blowing while the insect is still. Sound
   starts off; the Sound on press is the click browsers require before audio
   may play. */
(function () {
  "use strict";

  var stage = document.querySelector(".stage");
  var video = stage.querySelector("video");
  var wind = stage.querySelector("audio");
  var toggle = document.querySelector(".stage-toggle");
  var soundBtn = document.querySelector(".stage-sound");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var paused = reduced, onScreen = true, soundWanted = false;

  var PAD = 28;          // px of the source frame: a little room around the body
  var GAP = 0.25;        // s: further than this from a tracked sample, there is no insect
  var STOP = reduced ? 0 : 350, GO = reduced ? 0 : 450;  // ms to ease out and back in
  var LET_GO = 2.5;      // once stopped, the pointer must clear PAD × this to release it
  var COOL = 700;        // ms after letting go before the insect can be stopped again
  /* Each playbackRate write makes the browser re-time its pipeline, and
     writing a new value every frame is what made the ease stutter. The
     ease is walked through these few rates instead, so a stop or a start
     costs four or five writes rather than twenty-odd. */
  var RATES = [1, 0.7, 0.45, 0.25, 0.1];

  /* Where the insect lies through the clip: centre, length, width and angle
     of its body, sampled ten times a second, as fractions of the frame. */
  var track = [], frameW = 1920, frameH = 1080;
  fetch("../assets/video/caterpillar-track.json")
    .then(function (r) { return r.json(); })
    .then(function (d) { track = d.track; frameW = d.w; frameH = d.h; })
    .catch(function () {});

  function bodyAt(t) {
    var lo = 0, hi = track.length - 1;
    if (hi < 0) return null;
    while (lo < hi) {               // first sample at or after t
      var mid = (lo + hi) >> 1;
      if (track[mid][0] < t) lo = mid + 1; else hi = mid;
    }
    var b = track[lo], a = track[lo - 1] || b;
    if (Math.abs(b[0] - t) > GAP && Math.abs(a[0] - t) > GAP) return null;
    if (Math.abs(b[0] - t) > GAP) b = a;
    if (Math.abs(a[0] - t) > GAP) a = b;
    var k = b[0] > a[0] ? (t - a[0]) / (b[0] - a[0]) : 0;
    var da = b[5] - a[5];
    while (da > Math.PI / 2) da -= Math.PI;   // a body has no head or tail here
    while (da < -Math.PI / 2) da += Math.PI;
    return {
      x: (a[1] + (b[1] - a[1]) * k) * frameW,
      y: (a[2] + (b[2] - a[2]) * k) * frameH,
      len: (a[3] + (b[3] - a[3]) * k) * frameW,
      wid: (a[4] + (b[4] - a[4]) * k) * frameH,
      ang: a[5] + da * k
    };
  }

  /* Pointer, mapped from the page into the source frame (the video is
     letterboxed by object-fit: contain). */
  var pointer = { x: 0, y: 0, inside: false, touch: false };

  function overInsect(pad) {
    if (!pointer.inside || !video.videoWidth) return false;
    var box = video.getBoundingClientRect();
    var s = Math.min(box.width / video.videoWidth, box.height / video.videoHeight);
    var ox = (box.width - video.videoWidth * s) / 2, oy = (box.height - video.videoHeight * s) / 2;
    var x = (pointer.x - box.left - ox) / s * (frameW / video.videoWidth);
    var y = (pointer.y - box.top - oy) / s * (frameH / video.videoHeight);
    var body = bodyAt(video.currentTime);
    if (!body) return false;
    var dx = x - body.x, dy = y - body.y;
    var c = Math.cos(body.ang), sn = Math.sin(body.ang);
    var u = dx * c + dy * sn, v = -dx * sn + dy * c;
    return Math.abs(u) < body.len / 2 + pad && Math.abs(v) < body.wid / 2 + pad;
  }

  /* Stopping: the playback rate eases down to nothing and the clip pauses;
     going again, it eases back up, so the insect slows rather than freezes. */
  var held = false, ease = null, raf = 0, setRate = 1, coolUntil = 0;

  function applyRate(r) {
    var q = RATES[RATES.length - 1];
    for (var i = 0; i < RATES.length; i++) if (r >= RATES[i] - 0.06) { q = RATES[i]; break; }
    if (q === setRate) return;
    setRate = q;
    try { video.playbackRate = q; } catch (e) {}
  }

  function rate(from, to, ms, done) {
    var t0 = performance.now();
    ease = { from: from, to: to, ms: ms, t0: t0, done: done };
  }

  function stepEase(now) {
    if (!ease) return;
    var k = ease.ms ? Math.min(1, (now - ease.t0) / ease.ms) : 1;
    k = k * k * (3 - 2 * k);
    var r = ease.from + (ease.to - ease.from) * k;
    applyRate(r);
    if (k >= 1) { var d = ease.done; ease = null; if (d) d(); }
  }

  function hold(on) {
    if (held === on) return;
    held = on;
    if (on) {
      rate(setRate, 0.1, STOP, function () { if (held) video.pause(); });
    } else {
      coolUntil = performance.now() + COOL;
      applyRate(0.1);
      rate(0.1, 1, GO, null);
      sync();
    }
    kick();
  }

  function frame(now) {
    raf = 0;
    /* Hysteresis: a stopped insect lets go only once the pointer is well
       clear, and a released one cannot be caught again straight away —
       otherwise a pointer resting on its edge flickers it stop-go-stop. */
    var want = !paused && (held ? overInsect(PAD * LET_GO)
                                : now >= coolUntil && overInsect(PAD));
    hold(want);
    stepEase(now);
    if (pointer.inside || ease) kick();
  }

  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  function sync() {
    var live = onScreen && !document.hidden;
    if (live && !paused && !held) {
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else if (!held || !live || paused) {
      video.pause();
    }
    if (live && !paused && soundWanted) {
      var q = wind.play();
      if (q && q.catch) q.catch(function () {});
    } else {
      wind.pause();
    }
    toggle.textContent = paused ? "Play" : "Pause";
    toggle.setAttribute("aria-pressed", paused ? "true" : "false");
  }

  function point(e) {
    if (e.pointerType === "touch" && !pointer.touch) return;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.inside = true;
    kick();
  }

  stage.addEventListener("pointermove", point);
  stage.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "touch") pointer.touch = true;
    point(e);
  });
  function lift(e) {
    if (e.pointerType === "touch") pointer.touch = false;
    if (e.pointerType === "touch" || e.type === "pointerleave") {
      pointer.inside = false;
      hold(false);
    }
  }
  stage.addEventListener("pointerup", lift);
  stage.addEventListener("pointercancel", lift);
  stage.addEventListener("pointerleave", lift);
  stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      sync();
    }).observe(video);
  }
  document.addEventListener("visibilitychange", sync);

  toggle.addEventListener("click", function () {
    paused = !paused;
    if (paused) { held = false; ease = null; applyRate(1); }
    sync();
  });

  /* The button names the action it takes, so it carries no aria-pressed. */
  soundBtn.addEventListener("click", function () {
    soundWanted = !soundWanted;
    soundBtn.textContent = soundWanted ? "Sound off" : "Sound on";
    sync();
  });

  sync();
})();
</script>

</body>
</html>
